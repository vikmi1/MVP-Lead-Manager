# Public demo at https://vibecoding.aithinglab.com/mvp-lead-manager/
# Runs in demo mode: no email / Google Sheets, data is reset to sample leads periodically.
services:
  vibecoding-mvp-lead-manager:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: vibecoding-mvp-lead-manager
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/mvp-lead-manager"]
    env_file: .env
    environment:
      DEMO_MODE: "1"
      DEMO_RESET_MINUTES: "30"
      DB_PATH: /app/data/leads.db
      LOG_PATH: /dev/null
    # Caddy runs under a different Docker daemon: publish only on the gateway IP of its network
    ports:
      - "172.28.0.1:8094:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
